services:
  api:
    build: ../api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://macroforge:${DB_PASSWORD}@postgres:5432/macroforge
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks: [macroforge_net]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=macroforge
      - POSTGRES_USER=macroforge
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [macroforge_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks: [macroforge_net]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  macroforge_net:
    driver: bridge